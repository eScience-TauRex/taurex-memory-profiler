[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "taurex-memory-profiler"
version = "0.2.0"
description = "Measure and plot where the memory of a TauREx run goes: per node, per MPI rank and per process"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["memory", "profiling", "mpi", "slurm", "taurex", "exoplanets"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
]

[project.urls]
Repository = "https://github.com/eScience-TauRex/taurex-memory-profiler"

[project.optional-dependencies]
pyspy = ["py-spy"]
tests = ["pytest"]

[project.scripts]
taurex-mem-run = "taurex_memory_profiler.runner:main"
taurex-mem-plot = "taurex_memory_profiler.plot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 127
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
