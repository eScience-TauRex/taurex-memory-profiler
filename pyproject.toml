[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "taurex-memory-toolbox"
version = "0.1.0"
description = "Measure and plot where the memory of a TauREx run goes: per node, per MPI rank and per process"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["memory", "profiling", "mpi", "slurm", "taurex", "exoplanets"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
pyspy = ["py-spy"]
tests = ["pytest"]

[project.scripts]
memory-plot = "plot_memory:main"

[tool.setuptools]
# the toolbox is a handful of scripts, plot_memory.py is the only importable one
py-modules = ["plot_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 127
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
